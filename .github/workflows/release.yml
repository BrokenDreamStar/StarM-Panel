# 发布构建：dev 分支的 PR 合并进 main 时，产出 6 个单文件可执行程序并发成 Release。
#
# 目标（见 docs/DESIGN.md §2.2 ADR-001：全部依赖纯 JS 或 Bun 内置，故可交叉编译）：
#   macOS   arm64 / x86_64
#   Linux   arm64 / x86_64
#   Windows arm64 / x86_64
#
# 触发条件刻意写成「PR 被合并」而不是「push 到 main」：发布只跟着 dev → main 的合并走，
# 直接往 main 推文档之类的提交不会白跑一次全平台构建。需要在别的分支上手工验证时，
# 用 workflow_dispatch 选分支手动跑。
#
# 产物文件名带 package.json 的 version，例如 starm-panel-v0.1.1-linux-x64；
# Release tag 规则：每个版本的**首次**发布用 v<version>（如 v0.1.1），
# 同一版本重复发布才追加序号（v0.1.1-2、v0.1.1-3…）。序号由 prepare 阶段的
# scripts/release-tag.ts 读取仓库已有 tag 算出（见 src/shared/update.ts 的
# nextReleaseTag），首发保持干净；同版本再发时序号接着排，不会与旧 tag 冲突。
#
# Release 说明来自仓库根目录的 CHANGELOG.md：按 package.json 的版本号取
# `## <version>` 段落（scripts/release-notes.ts）。发版前先在 CHANGELOG.md
# 补一段，缺失时 prepare 阶段直接失败，不会发出一版空日志。
name: 构建发布产物

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# 同一条合并提交只保留最新一次构建；已开始的构建不打断，避免半成品产物
concurrency:
  group: release-${{ github.event.pull_request.merge_commit_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 与本地开发保持一致的 Bun 版本，避免编译产物随运行时漂移
  BUN_VERSION: 1.4.2

jobs:
  # 前端只构建一次：6 个目标共用同一份资源清单（src/server/generated/assets.ts），
  # 放到矩阵里各自构建会让 vite 白跑 6 遍
  prepare:
    name: 构建前端资源
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      # 产物文件名、Release 标题 / tag、构建摘要共用这一个版本号
      version: ${{ steps.meta.outputs.version }}
      # 本次发布 tag（首发 v<version>，同版本重复发布 v<version>-<n>）。
      # 只算一次：产物里注入的 STARM_RELEASE 与 Release tag 必须完全一致。
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: 读取版本号
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 先同步远程 tag，再按「该版本是否已发布过」决定带不带序号；
      # 结果写成 GitHub Actions 输出（tag=…），供 build / release 复用。
      - name: 计算发布 tag
        id: tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git fetch --tags --force --quiet
          bun run scripts/release-tag.ts "$VERSION" >> "$GITHUB_OUTPUT"

      # Release 说明来自仓库根目录的 CHANGELOG.md。这里先校验本版本段落存在，
      # 缺失就在 prepare 阶段失败，不浪费后面六平台的编译时间。
      - name: 校验 CHANGELOG.md 段落
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bun run scripts/release-notes.ts "$VERSION" > /dev/null

      # 顺序不能反：src/server/generated/assets.ts 用 `with { type: 'file' }`
      # 直接 import dist/ 下的构建产物，dist 不存在时 api.test.ts 拉起的真实服务器
      # 启动即崩（本机因为残留 dist 才看不出来，干净克隆的 CI 上必然失败）。
      - name: 构建前端（vite build）
        run: bun run build:web

      - name: 生成资源嵌入清单
        run: bun run build:assets

      - name: 类型检查
        run: bun run typecheck

      - name: 单元测试
        run: bun test

      # dist/ 必须一起带走：assets.ts 里是 `import "../../../dist/xxx" with { type: 'file' }`，
      # 编译时那些文件得真实存在，否则 bun build 直接报 Could not resolve
      - name: 上传前端产物与资源清单
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist/
            src/server/generated/assets.ts
          retention-days: 3

  build:
    name: 编译 ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # 单个目标失败不影响其它目标，便于一眼看出是哪个平台挂了
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            name: darwin-arm64
            label: macOS arm64
          - target: bun-darwin-x64
            name: darwin-x64
            label: macOS x86_64
          - target: bun-linux-arm64
            name: linux-arm64
            label: Linux arm64
          - target: bun-linux-x64
            name: linux-x64
            label: Linux x86_64
          - target: bun-windows-arm64
            name: windows-arm64
            label: Windows arm64
          - target: bun-windows-x64
            name: windows-x64
            label: Windows x86_64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 解到仓库根：压缩包里是 dist/ 与 src/server/generated/assets.ts 两个相对路径
      - name: 取回前端产物与资源清单
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      # 交叉编译：bun build --compile 会把对应平台的运行时一起塞进产物（scripts/build.ts 封装）
      # STARM_RELEASE 与下面「发布 Release」的 tag 完全一致（都来自 prepare 的 tag 输出）：
      # tag 会被写进产物，「设置 → 关于 → 检查更新」据此判断当前构建是不是最新发布
      - name: 编译可执行文件
        env:
          STARM_RELEASE: ${{ needs.prepare.outputs.tag }}
        run: bun run scripts/build.ts ${{ matrix.target }}

      # 只有和 runner 同平台的目标能真的跑起来；其余平台只能保证编译通过
      - name: 冒烟测试（本机可执行的目标）
        if: matrix.target == 'bun-linux-x64'
        run: ./release/starm-panel-v${{ needs.prepare.outputs.version }}-linux-x64 --version

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: starm-panel-v${{ needs.prepare.outputs.version }}-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release
    # prepare 是直接依赖：tag / version 都取自它的 outputs（作为构建任务的上游，它本来就已完成）
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # 全仓库默认只读，只有这一步需要写权限（建 tag / 建 Release）
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      # merge-multiple：把 6 个 artifact 解到同一目录，压缩包里本来就只有一个文件，
      # 文件名互不相同，不会互相覆盖
      - name: 取回全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: starm-panel-*
          path: release-out
          merge-multiple: true

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # 更新清单从**即将上传的同一批文件**算出大小与 sha256，
      # 面板的「检查更新」通过 /releases/latest/download/latest.json 读取它，
      # 不需要 GitHub API、token，也不需要猜资产名。
      - name: 生成更新清单 latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: bun run scripts/gen-update-manifest.ts release-out "$TAG"

      # Release 说明取自 CHANGELOG.md（prepare 已校验段落存在）：
      # 改文案只需要改仓库里的 CHANGELOG.md，这里不再维护静态模板。
      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bun run scripts/release-notes.ts "$VERSION" --out release-notes.md

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: StarM Panel ${{ needs.prepare.outputs.tag }}
          # 显式指定 tag 指向的提交，避免默认落到仓库默认分支的当前 tip
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          files: release-out/*
          fail_on_unmatched_files: true
          body_path: release-notes.md

  summary:
    name: 汇总产物
    needs: [prepare, build, release]
    runs-on: ubuntu-latest
    steps:
      - name: 写入构建摘要
        run: |
          {
            echo "## StarM Panel ${{ needs.prepare.outputs.tag }} 构建产物"
            echo
            echo "来源提交：\`${{ github.event.pull_request.merge_commit_sha || github.sha }}\`"
            echo
            echo "| 平台 | 运行环境 | 文件 |"
            echo "| --- | --- | --- |"
            echo "| macOS arm64 | Apple Silicon | \`starm-panel-v${{ needs.prepare.outputs.version }}-darwin-arm64\` |"
            echo "| macOS x86_64 | Intel | \`starm-panel-v${{ needs.prepare.outputs.version }}-darwin-x64\` |"
            echo "| Linux arm64 | ARM64 | \`starm-panel-v${{ needs.prepare.outputs.version }}-linux-arm64\` |"
            echo "| Linux x86_64 | AMD64 | \`starm-panel-v${{ needs.prepare.outputs.version }}-linux-x64\` |"
            echo "| Windows arm64 | ARM64 | \`starm-panel-v${{ needs.prepare.outputs.version }}-windows-arm64.exe\` |"
            echo "| Windows x86_64 | AMD64 | \`starm-panel-v${{ needs.prepare.outputs.version }}-windows-x64.exe\` |"
            echo
            echo "已发布到 Releases：\`${{ needs.prepare.outputs.tag }}\`；本次运行的 Artifacts 也保留 30 天。"
          } >> "$GITHUB_STEP_SUMMARY"
