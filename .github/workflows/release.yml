# 发布构建：dev 分支的 PR 合并进 main 时，产出 6 个单文件可执行程序。
#
# 目标（见 docs/DESIGN.md §2.2 ADR-001：全部依赖纯 JS 或 Bun 内置，故可交叉编译）：
#   macOS   arm64 / x86_64
#   Linux   arm64 / x86_64
#   Windows arm64 / x86_64
#
# 触发条件刻意写成「PR 被合并」而不是「push 到 main」：发布只跟着 dev → main 的合并走，
# 直接往 main 推文档之类的提交不会白跑一次全平台构建。需要在别的分支上手工验证时，
# 用 workflow_dispatch 选分支手动跑。
name: 构建发布产物

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# 同一条合并提交只保留最新一次构建；已开始的构建不打断，避免半成品产物
concurrency:
  group: release-${{ github.event.pull_request.merge_commit_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 与本地开发保持一致的 Bun 版本，避免编译产物随运行时漂移
  BUN_VERSION: 1.4.2

jobs:
  # 前端只构建一次：6 个目标共用同一份资源清单（src/server/generated/assets.ts），
  # 放到矩阵里各自构建会让 vite 白跑 6 遍
  prepare:
    name: 构建前端资源
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 顺序不能反：src/server/generated/assets.ts 用 `with { type: 'file' }`
      # 直接 import dist/ 下的构建产物，dist 不存在时 api.test.ts 拉起的真实服务器
      # 启动即崩（本机因为残留 dist 才看不出来，干净克隆的 CI 上必然失败）。
      - name: 构建前端（vite build）
        run: bun run build:web

      - name: 生成资源嵌入清单
        run: bun run build:assets

      - name: 类型检查
        run: bun run typecheck

      - name: 单元测试
        run: bun test

      # 只上传这一个文件：打包时前端产物与迁移 SQL 都经它访问
      - name: 上传资源清单
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: src/server/generated/assets.ts
          retention-days: 3

  build:
    name: 编译 ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # 单个目标失败不影响其它目标，便于一眼看出是哪个平台挂了
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            name: darwin-arm64
            label: macOS arm64
          - target: bun-darwin-x64
            name: darwin-x64
            label: macOS x86_64
          - target: bun-linux-arm64
            name: linux-arm64
            label: Linux arm64
          - target: bun-linux-x64
            name: linux-x64
            label: Linux x86_64
          - target: bun-windows-arm64
            name: windows-arm64
            label: Windows arm64
          - target: bun-windows-x64
            name: windows-x64
            label: Windows x86_64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 取回资源清单
        uses: actions/download-artifact@v4
        with:
          name: generated-assets
          path: src/server/generated/

      # 交叉编译：bun build --compile 会把对应平台的运行时一起塞进产物（scripts/build.ts 封装）
      - name: 编译可执行文件
        run: bun run scripts/build.ts ${{ matrix.target }}

      # 只有和 runner 同平台的目标能真的跑起来；其余平台只能保证编译通过
      - name: 冒烟测试（本机可执行的目标）
        if: matrix.target == 'bun-linux-x64'
        run: ./release/starm-panel-linux-x64 --version

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: starm-panel-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  summary:
    name: 汇总产物
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 写入构建摘要
        run: |
          {
            echo "## StarM Panel 构建产物"
            echo
            echo "来源提交：\`${{ github.event.pull_request.merge_commit_sha || github.sha }}\`"
            echo
            echo "| 平台 | 运行环境 | 文件 |"
            echo "| --- | --- | --- |"
            echo "| macOS arm64 | Apple Silicon | \`starm-panel-darwin-arm64\` |"
            echo "| macOS x86_64 | Intel | \`starm-panel-darwin-x64\` |"
            echo "| Linux arm64 | ARM64 | \`starm-panel-linux-arm64\` |"
            echo "| Linux x86_64 | AMD64 | \`starm-panel-linux-x64\` |"
            echo "| Windows arm64 | ARM64 | \`starm-panel-windows-arm64.exe\` |"
            echo "| Windows x86_64 | AMD64 | \`starm-panel-windows-x64.exe\` |"
            echo
            echo "产物在本次运行页面的 Artifacts 区域下载，保留 30 天。"
          } >> "$GITHUB_STEP_SUMMARY"
