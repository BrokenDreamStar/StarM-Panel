# 发布构建：推送版本 tag（v0.1.5 / v0.1.5-2）时，产出 6 个单文件可执行程序并发成 Release。
#
# 目标（见 docs/DESIGN.md §2.2 ADR-001：全部依赖纯 JS 或 Bun 内置，故可交叉编译）：
#   macOS   arm64 / x86_64
#   Linux   arm64 / x86_64
#   Windows arm64 / x86_64
#
# 触发条件是「推送 tag」而不是「合并 PR」：
#   - tag 是发布的唯一事实来源：产物里的 STARM_RELEASE、Release tag、下载地址都指向它；
#   - 构建失败后 Re-run 是安全的 —— 不会再算出一个新 tag（旧做法重跑会得到 v0.1.5-2
#     和第二个 Release）；tag 存在之后再重跑，只会补齐这次发布；
#   - 代码进 main 只是「合进主干」，发版是显式动作：bun run release:tag
#     （scripts/tag-release.ts，只允许在 main 上、工作区干净、CHANGELOG 有本版本段落时打 tag）；
#   - 需要手工验证某个 tag 时用 workflow_dispatch，填入已存在的 tag。
#
# 产物文件名带 package.json 的 version，例如 starm-panel-v0.1.5-linux-x64。
# tag 规则：每个版本的**首次**发布用 v<version>（如 v0.1.5），同一版本重复发布才追加序号
# （v0.1.5-2、v0.1.5-3…）。序号由本地 scripts/tag-release.ts 按已有 tag 算出
# （见 src/shared/update.ts 的 nextReleaseTag），CI 只校验「tag 的版本段 == package.json 版本」。
#
# Release 说明来自仓库根目录的 CHANGELOG.md：按 package.json 的版本号取
# `## <version>` 段落（scripts/release-notes.ts）。发版前先在 CHANGELOG.md
# 补一段，缺失时 prepare 阶段直接失败，不会发出一版空日志。
name: 构建发布产物

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的发布 tag（如 v0.1.5 / v0.1.5-2）
        required: true
        type: string

# 同一个 tag 只跑一次：Re-run、对同一 tag 手工触发都不会互相取消
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 与本地开发保持一致的 Bun 版本，避免编译产物随运行时漂移
  BUN_VERSION: 1.4.2

jobs:
  # 前端只构建一次：6 个目标共用同一份资源清单（src/server/generated/assets.ts），
  # 放到矩阵里各自构建会让 vite 白跑 6 遍
  prepare:
    name: 构建前端资源
    # 删除 tag 也会触发 push 事件，但此时 checkout 必然失败 —— 直接跳过，别留一条红叉
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      # 产物文件名、Release 标题、构建摘要共用这一个版本号
      version: ${{ steps.meta.outputs.version }}
      # 本次发布的 tag：tag 推送时就是它本身，手工触发时来自输入
      tag: ${{ steps.meta.outputs.tag }}
      # tag 指向的提交，Release 的 target_commitish 与构建摘要都用它
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # tag 推送时 github.ref_name 就是 tag 名；手工触发用输入里的 tag
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 解析发布信息
        id: meta
        run: |
          echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # tag 与版本号对不上（打错 tag / 忘了改 package.json）时，产物里的版本与 Release 会互相打架，
      # 必须在编译前停下。合法值：v<version> 或 v<version>-<序号>（如 0.1.5 的 v0.1.5 / v0.1.5-2）
      - name: 校验 tag 与版本号
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: bun run scripts/release-tag.ts "$TAG"

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # Release 说明来自仓库根目录的 CHANGELOG.md。这里先校验本版本段落存在，
      # 缺失就在 prepare 阶段失败，不浪费后面六平台的编译时间。
      - name: 校验 CHANGELOG.md 段落
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bun run scripts/release-notes.ts "$VERSION" > /dev/null

      # 顺序不能反：src/server/generated/assets.ts 用 `with { type: 'file' }`
      # 直接 import dist/ 下的构建产物，dist 不存在时 api.test.ts 拉起的真实服务器
      # 启动即崩（本机因为残留 dist 才看不出来，干净克隆的 CI 上必然失败）。
      - name: 构建前端（vite build）
        run: bun run build:web

      - name: 生成资源嵌入清单
        run: bun run build:assets

      - name: 类型检查
        run: bun run typecheck

      - name: 单元测试
        run: bun test

      # dist/ 必须一起带走：assets.ts 里是 `import "../../../dist/xxx" with { type: 'file' }`，
      # 编译时那些文件得真实存在，否则 bun build 直接报 Could not resolve
      - name: 上传前端产物与资源清单
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist/
            src/server/generated/assets.ts
          retention-days: 3

  build:
    name: 编译 ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # 单个目标失败不影响其它目标，便于一眼看出是哪个平台挂了
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            name: darwin-arm64
            label: macOS arm64
          - target: bun-darwin-x64
            name: darwin-x64
            label: macOS x86_64
          - target: bun-linux-arm64
            name: linux-arm64
            label: Linux arm64
          - target: bun-linux-x64
            name: linux-x64
            label: Linux x86_64
          - target: bun-windows-arm64
            name: windows-arm64
            label: Windows arm64
          - target: bun-windows-x64
            name: windows-x64
            label: Windows x86_64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 解到仓库根：压缩包里是 dist/ 与 src/server/generated/assets.ts 两个相对路径
      - name: 取回前端产物与资源清单
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      # 交叉编译：bun build --compile 会把对应平台的运行时一起塞进产物（scripts/build.ts 封装）
      # STARM_RELEASE 与下面「发布 Release」的 tag 完全一致（都来自 prepare 的 tag 输出）：
      # tag 会被写进产物，「设置 → 关于 → 检查更新」据此判断当前构建是不是最新发布
      - name: 编译可执行文件
        env:
          STARM_RELEASE: ${{ needs.prepare.outputs.tag }}
        run: bun run scripts/build.ts ${{ matrix.target }}

      # 只有和 runner 同平台的目标能真的跑起来；其余平台只能保证编译通过
      - name: 冒烟测试（本机可执行的目标）
        if: matrix.target == 'bun-linux-x64'
        run: ./release/starm-panel-v${{ needs.prepare.outputs.version }}-linux-x64 --version

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: starm-panel-v${{ needs.prepare.outputs.version }}-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release
    # prepare 是直接依赖：tag / version 都取自它的 outputs（作为构建任务的上游，它本来就已完成）
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # 全仓库默认只读，只有这一步需要写权限（建 / 更新 Release）
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # merge-multiple：把 6 个 artifact 解到同一目录，压缩包里本来就只有一个文件，
      # 文件名互不相同，不会互相覆盖
      - name: 取回全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: starm-panel-*
          path: release-out
          merge-multiple: true

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # 这一步除生成清单外，还把六平台裸产物打成归档并**删掉裸产物**：
      # Windows 打 .zip，macOS / Linux 打 .tar.gz（用户双击 / 系统自带 tar 都能解）。
      # 清单里的 size / sha256 描述解压后的可执行文件，archive 字段指向归档；
      # 面板的「检查更新」通过 /releases/latest/download/latest.json 读取它，
      # 不需要 GitHub API、token，也不需要猜资产名。
      - name: 生成更新清单 latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: bun run scripts/gen-update-manifest.ts release-out "$TAG"

      # Release 说明取自 CHANGELOG.md（prepare 已校验段落存在）：
      # 改文案只需要改仓库里的 CHANGELOG.md，这里不再维护静态模板。
      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bun run scripts/release-notes.ts "$VERSION" --out release-notes.md

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: StarM Panel ${{ needs.prepare.outputs.tag }}
          # tag 已存在（prepare 已检出它），这里显式给出它指向的提交：
          # 手工触发时 github.sha 是分支 tip，不能拿来做 Release 的目标提交
          target_commitish: ${{ needs.prepare.outputs.commit }}
          files: release-out/*
          fail_on_unmatched_files: true
          body_path: release-notes.md

  summary:
    name: 汇总产物
    needs: [prepare, build, release]
    runs-on: ubuntu-latest
    steps:
      - name: 写入构建摘要
        run: |
          {
            echo "## StarM Panel ${{ needs.prepare.outputs.tag }} 构建产物"
            echo
            echo "来源提交：\`${{ needs.prepare.outputs.commit }}\`"
            echo
            echo "| 平台 | 运行环境 | 文件 |"
            echo "| --- | --- | --- |"
            echo "| macOS arm64 | Apple Silicon | \`starm-panel-v${{ needs.prepare.outputs.version }}-darwin-arm64.tar.gz\` |"
            echo "| macOS x86_64 | Intel | \`starm-panel-v${{ needs.prepare.outputs.version }}-darwin-x64.tar.gz\` |"
            echo "| Linux arm64 | ARM64 | \`starm-panel-v${{ needs.prepare.outputs.version }}-linux-arm64.tar.gz\` |"
            echo "| Linux x86_64 | AMD64 | \`starm-panel-v${{ needs.prepare.outputs.version }}-linux-x64.tar.gz\` |"
            echo "| Windows arm64 | ARM64 | \`starm-panel-v${{ needs.prepare.outputs.version }}-windows-arm64.zip\` |"
            echo "| Windows x86_64 | AMD64 | \`starm-panel-v${{ needs.prepare.outputs.version }}-windows-x64.zip\` |"
            echo
            echo "已发布到 Releases：\`${{ needs.prepare.outputs.tag }}\`；本次运行的 Artifacts 也保留 30 天。"
          } >> "$GITHUB_STEP_SUMMARY"
